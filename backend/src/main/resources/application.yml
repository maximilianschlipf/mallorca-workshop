server:
  address: 127.0.0.1
  port: 18081
  servlet:
    session:
      timeout: 0
      cookie:
        http-only: true
        same-site: lax

spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:h2:file:./data/schulungsplaner;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
      path: /h2-console

app:
  demo-seed: false
